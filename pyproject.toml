[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vylor-savings-estimator"
version = "0.1.0"
description = "Estimate how much Vylor MCP would save on your Claude AI sessions"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["claude", "mcp", "vylor", "cost", "tokens", "savings", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
vylor-estimate = "vylor_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
