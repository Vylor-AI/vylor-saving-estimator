[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vylor-estimate"
version = "0.1.0"
description = "Estimate how much Vylor MCP would save on your Claude AI sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["claude", "mcp", "vylor", "cost", "tokens", "savings", "ai", "anthropic"]
authors = [
    { name = "Vylor AI" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://vylor.ai"
Repository = "https://github.com/Vylor-AI/vylor-saving-estimator"
"Bug Tracker" = "https://github.com/Vylor-AI/vylor-saving-estimator/issues"
Changelog = "https://github.com/Vylor-AI/vylor-saving-estimator/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "build>=1.0",
]

[project.scripts]
vylor-estimate = "vylor_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["src"]
